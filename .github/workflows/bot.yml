name: AM Jobs Bot

on:
  schedule:
    - cron: "7 * * * *"      # запасной перезапуск раз в час
  workflow_dispatch:          # ручной запуск / самоперезапуск

permissions:
  contents: write
  actions: write

concurrency:
  group: am-jobs-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bot loop (every 15 min, ~5h40m)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: "@Focus_Affiliate"
        run: |
          git config user.name "am-jobs-bot"
          git config user.email "am-jobs-bot@users.noreply.github.com"
          end=$((SECONDS + 20400))
          while [ $SECONDS -lt $end ]; do
            git pull --rebase --quiet || true
            python run.py || true
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -qm "bot state"
              git pull --rebase --quiet || true
              git push --quiet || true
            fi
            sleep 900
          done
      - name: Restart myself
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
