name: AM Jobs Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: am-jobs-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: "@Focus_Affiliate"
        run: python run.py
      - name: Save bot memory
        run: |
          git config user.name "am-jobs-bot"
          git config user.email "am-jobs-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "bot state" && git push
